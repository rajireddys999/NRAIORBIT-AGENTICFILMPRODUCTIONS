steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "--build-arg", "GIT_SHA=${_GIT_SHA}", "-f", "deploy/service/Dockerfile", "."]
images: ["${_IMAGE}"]
options: {machineType: E2_HIGHCPU_8}
substitutions: {_GIT_SHA: unknown}   # gcloud builds submit --substitutions _GIT_SHA=$(git rev-parse HEAD),...
