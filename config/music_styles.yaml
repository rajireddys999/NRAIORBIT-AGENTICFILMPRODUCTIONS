# Music style presets for generated background score (providers.music: lyria). A project picks one per slot:
#
#   music:
#     styles: {elevation: folk_mass, emotion: violin_swell}     # trailer defaults to the elevation pick
#
# slot: which cues use it (planning/score.py slot_for): elevation (veera peaks), action, villain (raudra), emotion
# (karuna/vatsalya), romance, tension, calm, trailer. shape: elevation (intro, build, drop, hit, drive, outro;
# the hit lands on the cue's strongest shot) or emotion (opening, build, peak, release; peak on the most intense shot).
# Describe the music itself: never name real composers, films or songs (generators refuse imitation; copyright).

presets:
  # ---------------------------------------------------------------- elevation (hero intro, interval, fight peaks)
  folk_mass:
    slot: elevation
    shape: elevation
    label: "Folk-percussion mass"
    style: >-
      Raw Telugu folk mass: a stomping teenmaar dappu groove, thunderous thavil rolls, urumi drone, piercing nadaswaram
      hero theme, conch calls, crowd whistles and claps, punchy low brass; earthy, rustic and overwhelming.
    sections:
      intro: low urumi drone, a distant dappu heartbeat and an echoing conch call
      build: dappu and thavil accelerate into a teenmaar groove, a rising low-brass ostinato, claps and whistles join
      drop: sudden near-silence, one held conch tone
      hit: massive full-band impact on the downbeat, every drum, a brass stab and a wordless shouted choir vowel together
      drive: full-power teenmaar stomp, the nadaswaram plays the hero theme over pounding thavil, whistles and claps
      outro: a final triple hit and a ringing conch tail

  epic_mythic:
    slot: elevation
    shape: elevation
    label: "Orchestral-epic mythic"
    style: >-
      Grand mythic film orchestra with Indian percussion: huge taiko and chenda drums, trombones and French horns,
      a large wordless Sanskrit-style choir, timpani, string ostinatos; slow-motion grandeur, god-like and majestic.
    sections:
      intro: low strings and a deep choir hum, slow timpani heartbeat
      build: driving string ostinato and rising horns, chenda rolls swelling, choir climbing
      drop: a breath of silence, only a high string harmonic
      hit: colossal orchestral and choir hit with taiko, cymbals and brass on the hero reveal
      drive: the hero theme blazes on horns and trombones over taiko and chenda, choir chanting wordless vowels
      outro: a final giant hit and a long choir and brass decay

  hybrid_trap_folk:
    slot: elevation
    shape: elevation
    label: "Modern hybrid (trap + folk)"
    style: >-
      Modern hybrid mass: hard trap and EDM drums, booming 808 sub-bass, distorted synth bass, layered with thavil and
      dappu, a nadaswaram hook, brass stabs, synth risers and impacts; swaggering, punchy, stadium-sized.
    sections:
      intro: filtered synth pulse, sub-bass swells and ticking hi-hats
      build: thavil and dappu rolls over a rising synth riser, snare roll accelerating, brass stabs getting louder
      drop: total cut to silence with a reversed cymbal
      hit: a huge beat drop with 808, distorted bass and a brass stab on the hero reveal
      drive: trap groove with folk percussion, the nadaswaram hook on top, whistles and crowd shouts as wordless texture
      outro: stutter edit into a final impact and a sub-bass boom

  # ---------------------------------------------------------------- emotion (mother sentiment, loss, flashback, sacrifice)
  violin_swell:
    slot: emotion
    shape: emotion
    label: "Solo violin + strings swell"
    style: >-
      Heart-wrenching solo Carnatic violin with gamakas over a tanpura drone, warm cello, then the full string orchestra
      swelling; intimate at first, overwhelming at the peak; goosebumps, tears.
    sections:
      opening: solo violin alone over a soft tanpura drone, slow and aching, with long held notes
      build: cellos and violas enter underneath, the melody climbs higher, a soft heartbeat of low drums
      peak: the full string orchestra swells to fortissimo on a rising key change, the violin soaring on its highest note
      release: everything falls away to the solo violin, ending on a long unresolved note

  alaap_choir:
    slot: emotion
    shape: emotion
    label: "Female alaap + choir crescendo"
    style: >-
      A wordless female alaap (pure vowels) over tanpura and soft piano, strings rising beneath, then a large wordless
      choir and timpani crescendo; spiritual, cathartic, spine-tingling.
    wordless_vocals: true
    sections:
      opening: solo wordless female alaap, free and close, over tanpura and sparse piano notes
      build: strings and a soft harp enter, the voice rises, a male choir hum joins underneath
      peak: full choir and orchestra crescendo with a timpani roll, the female voice soaring on top
      release: the choir fades, the lone female voice returns softly and ends on a breath

  nadaswaram_lament:
    slot: emotion
    shape: emotion
    label: "Nadaswaram/shehnai lament rising"
    style: >-
      A mournful shehnai and nadaswaram lament answered by bansuri flute, slow mridangam heartbeat, rising to full
      orchestra and choir; temple-like grief turning into strength.
    sections:
      opening: slow, mournful shehnai solo with bends, a distant bansuri answering
      build: the nadaswaram takes the melody, a slow mridangam heartbeat and low strings grow
      peak: full orchestra and wordless choir lift the lament into a powerful, defiant climax
      release: a last shehnai phrase over a fading drone
