name: ci

# Pull requests (one run each, the newest wins), pushes to the default branch (the merged result is tested, and its
# pip cache is the one new PRs can read), by hand, and from other workflows. Other branches no longer run on push,
# so a branch with a PR no longer runs twice.
on:
  pull_request:
  push:
    branches: [claude/telugu-ai-movie-generator-yhb6po]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"        # the images run 3.11 (deploy/ui/Dockerfile, deploy/service/Dockerfile)
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Keep ffmpeg's packages between runs
        # the runners' package mirror stalls now and then (18 minutes once, past 8 another time): downloaded once,
        # the packages come from GitHub's cache after that (a default-branch run fills it for every PR)
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-ffmpeg-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Install ffmpeg
        timeout-minutes: 12
        run: |
          if ! command -v ffmpeg > /dev/null || [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf ]; then
            mkdir -p ~/apt-archives/partial
            sudo apt-get update -o Acquire::Retries=3
            for try in 1 2 3; do       # a stalled download is cut off and tried again; what arrived is kept
              sudo timeout 240 apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
                -o Acquire::http::Timeout=20 -o Dir::Cache::Archives="$HOME/apt-archives" ffmpeg fonts-dejavu-core && break
              echo "the package mirror stalled (try $try of 3)"
              sudo dpkg --configure -a || true
            done
            sudo rm -f ~/apt-archives/lock && sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
          fi
          ffmpeg -version | head -1
      - name: Install package
        # ui: the control room's tests (tests/test_ui.py) skip without FastAPI, so CI must install it
        run: pip install -e ".[dev,google,ui]" ruff
      - name: Lint
        run: ruff check src tests
      - name: Validate asset library manifests
        run: nraiorbit library validate
      - name: Tests (the offline end-to-end demo and the control room included)
        # every core of the runner; the slowest tests are listed so a new slow one is seen at once
        run: pytest -q -n auto --durations=15
