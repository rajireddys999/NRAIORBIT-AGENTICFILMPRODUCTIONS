# NRAIORBIT pipeline configuration.
# Copy into a project (projects/<slug>/pipeline.yaml) to override per film.

film:
  runtime_minutes: 105
  runtime_tolerance_minutes: 3
  structure_template: auto         # auto | telugu_commercial | family_drama | thriller | village_action
  language: te
  subtitle_languages: [te, en]
  resolution: [1920, 1080]         # generation is upscaled to this; use [3840, 2160] for 4K masters
  fps: 24
  trailer_seconds: 135
  trailer_line_max_s: 7.5          # a trailer carries only whole lines up to this long (picture cut around them)
  trailer_max_lines: 5             # most lines in one trailer: hero intro, villain threat, emotion, punch, stinger
  teaser_seconds: 60               # teaser stage is planned; not produced yet

animatic:
  resolution: [640, 360]           # placeholder render size when all generators are mock

# On-screen cards over the live picture of the finished movie (11_master/movie.mp4). A card never changes the film's
# length or its sync: the frame is darkened under it and it fades in and out (post/cards.py). Times are film seconds;
# a card past the end of the film is skipped, one running past it is cut. Telugu needs a Noto/Lohit Telugu font and
# Pillow with RAQM, else only the English line is drawn. Changing cards re-lays them without re-mastering.
cards: auto                        # the film's name over its opening (before the first line), and శుభం / THE END
                                   # after its last frame; [] for none, or a list as below
# cards:
#   - {kind: title, at_s: 75.5, length_s: 2.5, text_te: "గోదావరి సింహం", text_en: "GODAVARI SIMHAM"}
#   - {kind: interval, at_s: 261.0, length_s: 2.0, text_te: "విరామం", text_en: "INTERVAL"}
#   - {kind: end, at_s: 617.5, length_s: 2.5, text_te: "గోదావరి సింహం", text_en: "GODAVARI SIMHAM"}
#   # optional per card: image: inbox/title.png   (a designed title image, relative to the project, instead of text)

llm:
  model: claude-opus-5-5
  max_tokens: 64000
  effort:                          # per agent: low | medium | high | xhigh | max
    story_analyst: high
    screenwriter: high
    dialogue_critic: medium
    director: high
    music_director: medium
    casting: medium
    editor: high                   # reads the owner's rejection and decides what to redo (service/triage.py)
  critique_rounds: 2
  critique_pass_score: 8
  concurrency: 2                   # independent Claude calls at once (shot lists per scene). 1 = one at a time, as before. Each call gets the same inputs as in the one-at-a-time order

# Provider per capability. "mock" renders placeholders with ffmpeg (animatic mode).
# Production values are adapter names registered in src/nraiorbit/providers/.
providers:
  keyframe: mock                   # e.g. comfyui_flux_pulid, comfyui_qwen_image
  video: mock                      # e.g. comfyui_wan_i2v, api_kling, api_veo
  tts: mock                        # e.g. indic_parler, indicf5, sarvam, rvc_convert
  lipsync: none                    # latentsync_cloudrun: LatentSync on your Cloud Run L4 GPU (deploy/lipsync/setup.sh)
                                   # sync_so: sync.so's API (sync-3 / lipsync-2-pro; key in SYNC_API_KEY; lipsync.model)
  music: mock                      # mock | inbox (inbox/music/<cue_id>.wav) | lyria (Google Lyria 3, paid: google.music_*)
  sfx: none                        # e.g. library_then_generate
  face_embedder: none              # e.g. insightface (check licence), rekognition
  speaker_embedder: none           # e.g. speechbrain_ecapa

google:                            # used by the veo / gemini / lyria providers (providers/google_ai.py, lyria.py)
  vertex: false                    # true = Vertex AI (GOOGLE_CLOUD_PROJECT, GOOGLE_CLOUD_LOCATION)
  veo_location: null               # Vertex AI only: region per model, overrides GOOGLE_CLOUD_LOCATION
  image_location: null             #   (Veo: us-central1; gemini-3-pro-image: global)
  tts_location: null
  music_location: global           #   (Lyria 3 is served from global only)
  veo_model: veo-3.1-fast-generate-001   # `nraiorbit google models` lists what your key can use; a retired
                                         # -preview name is replaced by its released -001 name when Google says so
  veo_tier: fast                   # pricing tier of that model: standard | fast | lite
  veo_resolution: 720p             # generate 720p; the edit upscales to film.resolution
  veo_mode: keyframe               # keyframe (Gemini first frame -> Veo) | reference (Veo asset references, 8 s)
  video_tiers:                     # per-shot Veo settings (shot.video_tier picks one; null = the three above)
    standard_1080p: {model: veo-3.1-generate-001, tier: standard, resolution: 1080p}
    standard_720p: {model: veo-3.1-generate-001, tier: standard, resolution: 720p}
    fast_720p: {model: veo-3.1-fast-generate-001, tier: fast, resolution: 720p}
    lite_720p: {model: veo-3.1-lite-generate-001, tier: lite, resolution: 720p}   # public preview
  person_generation: allow_adult
  veo_audio: false                 # Vertex AI only: Veo's own audio (dropped in the edit; dialogue is TTS) costs extra
  poll_seconds: 10
  timeout_seconds: 900
  image_model: gemini-2.5-flash-image
  tts_model: gemini-2.5-flash-preview-tts
  tts_language_code: null          # auto-detected from Telugu script; set if your model needs it
  music_model: lyria-3-pro-preview # providers.music: lyria; lyria-3-clip-preview = cheaper 30 s clips, looped to the cue
  music_response_modalities: [AUDIO, TEXT]   # Lyria 3 on Vertex refuses [AUDIO] alone (400 INVALID_ARGUMENT); it returns
                                             # a text description plus audio/mpeg (verified 2026-10-14)

lipsync:                           # used by providers.lipsync: latentsync_cloudrun (and sync_so: model, sync_mode,
                                   # concurrency, poll_seconds, url_ttl_minutes, api_key_env; bucket is shared)
  job: nraiorbit-lipsync
  region: us-central1
  bucket: null                     # default <GOOGLE_CLOUD_PROJECT>-media (private; staging deleted after 7 days)
  steps: 20                        # LatentSync inference steps
  guidance: 1.5
  timeout_seconds: 21600           # 6 h: one shot takes ~10 min on an L4, so 3600 s fits only ~6
  on_failure: stop                 # stop | keep_original (a shot LatentSync cannot do keeps its clip, logged)
  speaker_lock: true               # LatentSync sees only the speaker (a crop, other faces blanked) and only the
                                   # speaker's mouth and jaw change (post/facelock.py; pip install -e '.[lipsync]')
  lock_ratio: 1.5                  # a frame changed this much more away from the speaker than on the speaker's
  lock_floor: 10                   # mouth (and at least lock_floor, 0-255) was synced on someone else
  max_off_speaker_frames: 3        # a paid whole-frame result is reused only if it missed the speaker in <= this
  offline: false                   # true: use results made before only; never start a GPU job
  detail: 1.0                      # put the original's skin, stubble and moustache texture back on the synced
                                   # face where its shape is unchanged (never on the lips); 0 = off
  mesh: true                       # place the paste-back on the speaker's face mesh (MediaPipe Face Landmarker):
                                   # on the real lips even when the head is turned, and clipped to the face outline,
                                   # so a smear LatentSync made on the background beside the face never shows
  model_dir: null                  # where the face models are kept (default ~/.cache/nraiorbit)
  sync_silence: always             # what the model gets of a speaking shot: always: the speaker's whole visible run,
                                   # silence included (it closes a mouth the video model left moving) | auto: silent
                                   # stretches where the filmed mouth is already still stay as filmed (nothing to fix,
                                   # nothing to pay; the rest is synced) | never: only the lines and a margin
  silence_margin_frames: 6         # frames of silence synced on each side of a line (the mouth opens and closes)
  silence_fade_frames: 3           # dissolve between the synced and the filmed mouth at those edges (per-shot
                                   # fade_frames wins)
  shots: {}                        # per shot, from review: {sync: false} keep as filmed | {speaker: [x, y]} a point
                                   # on the speaker's face (fractions of the frame) | {keep_frames: [[a, b]]} frames
                                   # left as filmed (LatentSync is not given them: new crops, a new GPU job) |
                                   # {filmed_frames: [[a, b]]} frames shown as filmed in the paste-back only (the
                                   # paid result is reused) | {fade_frames: 2} dissolve the synced mouth in and out
                                   # next to frames kept as filmed | {repair_frames: [[a, b]]} frames between a and b
                                   # rebuilt from them | {bridge_gaps: 8} close face gaps up to this many frames (a
                                   # crop-mode gap takes the whole-frame mouth) | {extend_track: true} another
                                   # track of the same face carries the speaker's on (a split detection; a number
                                   # instead of true: the least box overlap that counts, default 0.3) |
                                   # {mode: crop} never reuse a
                                   # whole-frame result | {protect: {above: 185}} keep as filmed the pixels brighter
                                   # (or {below: 40} darker) than this | {detail: 0.5} | {mesh: false} |
                                   # {sync_s: 4.8} the shot was cut shorter in the edit after lip-sync: its take
                                   # stays at the synced length (the lip-sync is reused), the edit plays the start |
                                   # {cut_in_s: 0.25} the edit cuts into the shot this much later (04_shots: the
                                   # shot shortened, the one before it lengthened by exactly as much; not a scene's
                                   # first shot): its take, lip-sync and lines keep their film times (reused)

shots:
  billable_grid: false             # true: shot lengths on the video model's billed clip lengths (Veo: 4, 6 or 8 s;
                                   # 8 s only at 1080p), scenes on even seconds, so no generated second is paid for and
                                   # trimmed away. Off: shots fitted proportionally (existing projects stay as planned)

budget:
  max_usd: 50                      # hard stop for paid generation in one project (cost.jsonl ledger)

render:
  only: []                         # generate only these ([] = all): scene ids, shot ids, "trailer"; others reuse paid clips

voice:
  animals_speak: false             # false: the lines of a character the story bible marks silent_animal are its
                                   # sounds, written as action (no voice, no lip-sync); true: every animal talks;
                                   # [ids]: just those animals talk
  auto_cast: false                 # true: each speaking character without a voice gets one from the ElevenLabs
                                   # account at the cast step (the runner's template sets it); the owner can change any
  mode: tts                        # performance_vc | tts | api_tts_vc  (see docs/VOICE_TELUGU.md)
  takes_per_line: 3
  max_pause_s: 0.6                 # generated speech: pauses longer than this are shortened to ~0.3 s (null = off)
  # crowd: {sc012_b007: {voices: 6}}  # chanted lines (Gemini TTS): the speaker's voice leads, voices-1 other
  #                                   # prebuilt voices join (one paid call each); no voice guard on these

guards:
  identity:
    sample_every_n_frames: 6
    min_mean_similarity: {CU: 0.55, MCU: 0.55, ECU: 0.55, MS: 0.45, two_shot: 0.45, OTS: 0.45}
    min_frame_similarity: 0.40
    max_similarity_std: 0.08
    min_face_px: 48
    min_body_similarity: 0.75
  voice:
    min_speaker_similarity: 0.70
    max_cer: 0.15
    min_mos: 3.5
    duration_tolerance: 0.20

retakes:
  max_per_shot: 4
  max_per_line: 3
  escalation: [new_seed, stronger_identity, simpler_motion, alt_provider]

cast:
  build_identity: false            # true: a film that makes first frames or video gets its new characters a library
                                   # entry and reference pictures (Gemini, a few cents each, under the cap) before the
                                   # cast gate (the runner's template sets it); false: `nraiorbit identity build`

review_gates:
  story: {enabled: true, auto_approve: false}
  cast: {enabled: true, auto_approve: false}
  pacing: {enabled: true, auto_approve: false}
  final_cut: {enabled: true, auto_approve: false}
  trailer: {enabled: true, auto_approve: false}
  # the step gates between stages: off here, on (auto_approve: false) in the control room's project template so a
  # queued film waits for a look after every step; cost, faces and publish are the runner's own gates (service/produce)
  outline: {enabled: true, auto_approve: true}
  scenes: {enabled: true, auto_approve: true}
  shots: {enabled: true, auto_approve: true}
  render: {enabled: true, auto_approve: true}

audio:
  master_lufs: -14
  true_peak_db: -1
  dialogue_duck_db: -10
  dialogue_level_dbfs: -20             # every take brought to this speaking level before mixing (null = off)
  min_voice_over_music_db: 12          # any line quieter than this over the music is lifted (0 = off)
  sample_rate: 48000
