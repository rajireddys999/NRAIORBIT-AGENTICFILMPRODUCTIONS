# NRAIORBIT pipeline configuration.
# Copy into a project (projects/<slug>/pipeline.yaml) to override per film.

film:
  runtime_minutes: 105
  runtime_tolerance_minutes: 3
  structure_template: auto         # auto | telugu_commercial | family_drama | thriller | village_action
  language: te
  subtitle_languages: [te, en]
  resolution: [1920, 1080]         # generation is upscaled to this; use [3840, 2160] for 4K masters
  fps: 24
  trailer_seconds: 135
  trailer_line_max_s: 7.5          # a trailer carries only whole lines up to this long (picture cut around them)
  trailer_max_lines: 5             # most lines in one trailer: hero intro, villain threat, emotion, punch, stinger
  teaser_seconds: 60               # teaser stage is planned; not produced yet

animatic:
  resolution: [640, 360]           # placeholder render size when all generators are mock

llm:
  model: claude-opus-5-5
  max_tokens: 64000
  effort:                          # per agent: low | medium | high | xhigh | max
    story_analyst: high
    screenwriter: high
    dialogue_critic: medium
    director: high
    music_director: medium
    casting: medium
  critique_rounds: 2
  critique_pass_score: 8

# Provider per capability. "mock" renders placeholders with ffmpeg (animatic mode).
# Production values are adapter names registered in src/nraiorbit/providers/.
providers:
  keyframe: mock                   # e.g. comfyui_flux_pulid, comfyui_qwen_image
  video: mock                      # e.g. comfyui_wan_i2v, api_kling, api_veo
  tts: mock                        # e.g. indic_parler, indicf5, sarvam, rvc_convert
  lipsync: none                    # latentsync_cloudrun: LatentSync on your Cloud Run L4 GPU (deploy/lipsync/setup.sh)
  music: mock                      # mock | inbox (inbox/music/<cue_id>.wav) | lyria (Google Lyria 3, paid: google.music_*)
  sfx: none                        # e.g. library_then_generate
  face_embedder: none              # e.g. insightface (check licence), rekognition
  speaker_embedder: none           # e.g. speechbrain_ecapa

google:                            # used by the veo / gemini / lyria providers (providers/google_ai.py, lyria.py)
  vertex: false                    # true = Vertex AI (GOOGLE_CLOUD_PROJECT, GOOGLE_CLOUD_LOCATION)
  veo_location: null               # Vertex AI only: region per model, overrides GOOGLE_CLOUD_LOCATION
  image_location: null             #   (Veo: us-central1; gemini-3-pro-image: global)
  tts_location: null
  music_location: global           #   (Lyria 3 is served from global only)
  veo_model: veo-3.1-fast-generate-preview   # `nraiorbit google models` lists what your key can use
  veo_tier: fast                   # pricing tier of that model: standard | fast | lite
  veo_resolution: 720p             # generate 720p; the edit upscales to film.resolution
  veo_mode: keyframe               # keyframe (Gemini first frame -> Veo) | reference (Veo asset references, 8 s)
  person_generation: allow_adult
  veo_audio: false                 # Vertex AI only: Veo's own audio (dropped in the edit; dialogue is TTS) costs extra
  poll_seconds: 10
  timeout_seconds: 900
  image_model: gemini-2.5-flash-image
  tts_model: gemini-2.5-flash-preview-tts
  tts_language_code: null          # auto-detected from Telugu script; set if your model needs it
  music_model: lyria-3-pro-preview # providers.music: lyria; lyria-3-clip-preview = cheaper 30 s clips, looped to the cue
  music_response_modalities: [AUDIO, TEXT]   # Lyria 3 on Vertex refuses [AUDIO] alone (400 INVALID_ARGUMENT); it returns
                                             # a text description plus audio/mpeg (verified 2026-10-14)

lipsync:                           # used by providers.lipsync: latentsync_cloudrun
  job: nraiorbit-lipsync
  region: us-central1
  bucket: null                     # default <GOOGLE_CLOUD_PROJECT>-media (private; staging deleted after 7 days)
  steps: 20                        # LatentSync inference steps
  guidance: 1.5
  timeout_seconds: 3600

budget:
  max_usd: 50                      # hard stop for paid generation in one project (cost.jsonl ledger)

render:
  only: []                         # generate only these ([] = all): scene ids, shot ids, "trailer"; others reuse paid clips

voice:
  mode: tts                        # performance_vc | tts | api_tts_vc  (see docs/VOICE_TELUGU.md)
  takes_per_line: 3
  max_pause_s: 0.6                 # generated speech: pauses longer than this are shortened to ~0.3 s (null = off)

guards:
  identity:
    sample_every_n_frames: 6
    min_mean_similarity: {CU: 0.55, MCU: 0.55, ECU: 0.55, MS: 0.45, two_shot: 0.45, OTS: 0.45}
    min_frame_similarity: 0.40
    max_similarity_std: 0.08
    min_face_px: 48
    min_body_similarity: 0.75
  voice:
    min_speaker_similarity: 0.70
    max_cer: 0.15
    min_mos: 3.5
    duration_tolerance: 0.20

retakes:
  max_per_shot: 4
  max_per_line: 3
  escalation: [new_seed, stronger_identity, simpler_motion, alt_provider]

review_gates:
  story: {enabled: true, auto_approve: false}
  cast: {enabled: true, auto_approve: false}
  pacing: {enabled: true, auto_approve: false}
  final_cut: {enabled: true, auto_approve: false}
  trailer: {enabled: true, auto_approve: false}

audio:
  master_lufs: -14
  true_peak_db: -1
  dialogue_duck_db: -10
  sample_rate: 48000
