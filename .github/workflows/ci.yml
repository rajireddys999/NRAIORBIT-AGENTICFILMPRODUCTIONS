name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install package
        run: pip install -e ".[dev]" ruff
      - name: Lint
        run: ruff check src tests
      - name: Validate asset library manifests
        run: nraiorbit library validate
      - name: Tests (includes the offline end-to-end demo)
        run: pytest -q
