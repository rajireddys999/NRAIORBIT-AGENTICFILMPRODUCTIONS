# Prices used by `nraiorbit estimate`. All USD.
#
# These are planning numbers. Veo and cloud GPU figures come from third-party price trackers
# (captured 2026-10, see docs/POC_RUNBOOK.md for sources); verify on the providers'
# own pricing pages before budgeting. Prices are before tax: Indian bills add 18% GST.
# Edit this file, or override per project in projects/<slug>/pricing.yaml.

attempts_per_clip:          # average generations per kept clip (identity/quality retakes)
  low: 1.3
  expected: 2.0
  high: 3.0

claude:                      # Anthropic API, per million tokens
  model: claude-opus-5-5
  input: 4.00
  output: 20.00
  cache_write: 5.00          # ~1.25x input (5-minute cache)
  cache_read: 0.20
  thinking_multiplier: 1.5   # extra output tokens spent on adaptive thinking (assumption)

veo:
  durations_s: [4, 6, 8]     # clip lengths Veo can generate; a shot is billed at the next one up
  extension_s: 7             # each "extend" adds this much for shots longer than 8 s
  reference_clip_s: 8        # reference-image mode generates fixed 8 s clips
  durations_by_resolution:   # 1080p clips are 8 s only
    720p: [4, 6, 8]
    1080p: [8]
  resolution: 720p           # 720p | 1080p (generate 720p, upscale finals)
  api_per_second:            # video + audio, per generated second: Vertex AI with veo_audio true (verified
                             # 2026-10-14); also used for the Gemini API, whose rates were not rechecked
    standard: {720p: 0.40, 1080p: 0.40}
    fast:     {720p: 0.10, 1080p: 0.12}
    lite:     {720p: 0.05, 1080p: 0.08}
  api_per_second_video_only: # Vertex AI with generate_audio false (google.vertex true, google.veo_audio false);
    standard: {720p: 0.20, 1080p: 0.20}   # verified 2026-10-14 on cloud.google.com/vertex-ai/generative-ai/pricing
    fast:     {720p: 0.08, 1080p: 0.10}
    lite:     {720p: 0.03, 1080p: 0.05}
  flow_credits_per_clip:     # Gemini app / Flow subscription (non-Ultra accounts)
    standard: 100
    fast: 20
    lite: 10
  flow_plan:                 # used to turn credits into months of subscription
    name: Google AI Pro
    monthly_usd: 19.99
    monthly_credits: 1000

gemini:                      # Gemini API, third-party estimates; verify on ai.google.dev/pricing
  image_per_image: 0.04      # keyframes and identity-pack images (flash-image class, 1K)
  tts_per_minute: 0.02       # Telugu speech (~$10 per 1M audio tokens)

lyria:                       # Google Lyria 3 background score (providers.music: lyria), per generated track
  # Re-renders reuse cached tracks (cache/music/) and are not billed again.
  per_generation:
    lyria-3-pro-preview: 0.08    # "Lyria 3 Pro full song $0.08 / 1 count", Vertex AI pricing, verified 2026-10-14
    lyria-3-clip-preview: 0.10   # UNVERIFIED conservative placeholder: check the Vertex AI pricing page (Lyria)

cloud: gcp                   # where lip-sync runs and media is backed up: gcp | aws

gcp:                         # Google Cloud: the same project as the Gemini API key
  name: Google Cloud
  instance: g2-standard-4    # 1x NVIDIA L4 24 GB, asia-south1 (Mumbai)
  hourly: 0.74               # on-demand, Linux; Spot is ~0.29/h but can be stopped at any time
  setup_hours: 1.0           # boot, install, model download, per session
  lipsync_minutes_per_shot: {low: 1.0, expected: 2.0, high: 4.0}
  storage: Cloud Storage
  storage_per_gb_month: 0.023  # Standard class, single region

aws:                         # alternative: the same L4 GPU on AWS
  name: AWS
  instance: g6.xlarge        # 1x L4 24 GB; g5.xlarge (A10G) is ~1.21/h in Mumbai
  hourly: 0.97               # ap-south-1 on-demand, Linux
  setup_hours: 1.0
  lipsync_minutes_per_shot: {low: 1.0, expected: 2.0, high: 4.0}
  storage: S3
  storage_per_gb_month: 0.025

mac:                         # your MacBook: no bill, only time
  keyframe_seconds_per_image: {low: 40, expected: 90, high: 180}
  keyframe_candidates_per_shot: 4
  tts_seconds_per_line: {low: 10, expected: 25, high: 60}

cloud_run_gpu:            # lip-sync worker (deploy/lipsync): Cloud Run job, 1x NVIDIA L4 + 4 vCPU / 16 GiB, us-central1
  per_hour: 1.10          # UNVERIFIED estimate (L4 ~$0.67/h + CPU/memory ~$0.37/h); check cloud.google.com/run/pricing
  startup_minutes: 6      # image pull + model load, once per job execution
  minutes_per_clip: 10.0  # LatentSync 1.6 on a 6-8 s 1080p shot (measured ~9.7 min on an L4, 2026-10-14)

gemini_video:             # watching a public film for craft notes (nraiorbit learn youtube), Gemini 2.5 Pro
  input_per_1m: 1.25      # planning numbers: Gemini 2.5 Pro list price per 1M input tokens up to 200k per request,
  input_per_1m_long: 2.50 # above 200k; verify on ai.google.dev/pricing before budgeting
  output_per_1m: 10.00
  tokens_per_frame: 258   # what a sampled video frame costs in tokens; audio adds 32 tokens per second
  audio_tokens_per_s: 32

elevenlabs:               # Telugu voices through ElevenLabs (providers.tts: elevenlabs), per 1,000 characters
  per_1k_chars: 0.18      # list price; a Creator/Pro plan includes characters, so the ledger's figure is an upper bound
  sfx_per_sound: 0.03     # sound effects (the custom model feed's sfx/): UNVERIFIED planning figure; ElevenLabs bills 100
                          # credits a sound (11-20 a second when its length is set): about $0.02-0.03 on most plans

sync_so:                  # lip-sync through sync.so's API (providers.lipsync: sync_so), per second of output at 25 fps
  per_second:             # sync.so/pricing, 2026-10-16 (base rates; subscription tiers discount 5-20 %)
    sync-3: 0.133         # 4K native, opens silent lips, obstruction handling
    lipsync-2-pro: 0.083  # diffusion super-resolution for teeth/beards; needs speaking motion in the source
    lipsync-2: 0.04

vertex_endpoint_gpu:      # lip-sync on a temporary Vertex AI endpoint (g2-standard-8 + 1x L4), billed while deployed
  per_hour: 0.98181       # Vertex AI prediction g2-standard-8 incl. 1x L4, us-central1 (verified 2026-10-14)
  startup_minutes: 25     # register + create + deploy (measured ~30 min end to end for 2 shots)
  minutes_per_clip: 10.0  # measured ~9.7 min per 6-8 s 1080p shot (2 runs, 7 shots)
