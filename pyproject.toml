[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nraiorbit"
version = "0.1.0"
description = "Agentic pipeline: story prompt to Telugu feature film, trailer and YouTube release"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.13",
  "pydantic>=2.7",
  "pyyaml>=6",
  "numpy>=1.26",
  "pillow>=10",                                     # movie cards (Telugu shaping needs libraqm: post/cards.py)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]                   # httpx: FastAPI's TestClient (control room tests)
publish = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2", "google-cloud-secret-manager>=2.20"]
google = ["google-genai>=2.30",                      # Veo, Gemini image, Gemini TTS and Lyria providers
          "google-cloud-run>=0.10", "google-cloud-storage>=2.16"]   # lip-sync job on Cloud Run (deploy/lipsync)
lipsync = ["mediapipe>=0.10.14"]                    # lip-sync speaker lock: BlazeFace face detector (Apache-2.0)
guards = ["insightface>=0.7", "onnxruntime-gpu>=1.17", "opencv-python>=4.9", "speechbrain>=1.0", "torchaudio>=2.2"]
ui = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9",   # the control room (nraiorbit ui)
      "google-cloud-run>=0.10", "google-cloud-logging>=3.10", "google-cloud-storage>=2.16",
      "cryptography>=42", "google-cloud-secret-manager>=2.20", "google-api-python-client>=2.100"]

[project.scripts]
nraiorbit = "nraiorbit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nraiorbit = ["prompts/*.md", "ui/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
