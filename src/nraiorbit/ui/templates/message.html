{% extends "base.html" %}
{% block title %}{{ status }} · {{ settings.title }}{% endblock %}
{% block body %}
<div class="card" style="max-width:640px;margin:48px auto;text-align:center;padding:48px 32px">
  <p class="eyebrow">The control room says</p>
  <h1 style="font-size:96px;line-height:1;margin:0 0 14px">{{ status }}</h1>
  <p class="muted" style="font-size:16px">{{ detail }}</p>
  <p style="margin-top:24px"><a class="btn quiet" href="/">Back to the films</a></p>
</div>
{% endblock %}
